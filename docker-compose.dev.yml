services:
  kanbei:
    build:
      context: .
      target: development
    init: true
    ports:
      - "127.0.0.1:${KANBEI_PORT:-18473}:5173"
    environment:
      NODE_ENV: development
      HOST: 127.0.0.1
      PORT: "8787"
      KANBEI_PUBLIC_PORT: "${KANBEI_PORT:-18473}"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "250"
    volumes:
      - ./src:/app/src:ro
      - ./drizzle:/app/drizzle:ro
      - ./index.html:/app/index.html:ro
      - ./vite.config.ts:/app/vite.config.ts:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tsconfig.server.json:/app/tsconfig.server.json:ro
      - ./data:/app/data
    restart: unless-stopped
